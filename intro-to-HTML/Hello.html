<!DOCTYPE html>
<html>
  <head>
      <style>
        p{
          margin-top:0px;
          margin-bottom: 0px;

        }
        .cat{
          width: 200px;
          border-radius: 15px;
          /* object-fit: contain; */
        }

        .square{
          width: 300px;
          height: 300px;
          object-fit: cover;
          object-position: top;
          border-radius: 0px;
        }

        .circle{
          width: 200px;
          height: 200px;
          object-fit: cover;
          object-position: center;
          border-radius: 100px;
        }

        .input{
          width: 85px;
          padding-top: 5px;
          padding-bottom: 5px;
          padding-left: 5px;
          border-radius: 5px;
          border-width: 1px;
          border-color: rgb(194, 190, 190);
          border-style: solid;
          outline: none;
          /* border: solid; */
        }

        .search{
          width: 300px;
          font-size: 12px;
          color: #d8d9da;
          border-radius: 20px;
          border: none;
          padding: 7px 7px ;
          padding-left: 8px;
          border-width: 1px;
          border-color: #d8d9da;
          border-style: solid;
          box-shadow: 0px 1px 6px rgba(0, 0, 0, 0.15);
        }
        
        .email{
          font-family: Arial;
          margin-bottom: 5px;
          color: #9b9c9d;

        }
        .MMM{
          width: 200px;
          margin-bottom: 13px;
          border-style: solid;
          padding: 5px 5px;
          border-radius: 5px;
          border-width: 1px;
          /* border: none; */
          border-color: solid black;

        }

        .tweet{
          background-color: rgb(23, 118, 181);
          color: white;
          height: 30px;
          border-radius: 15px;
          border: none;
          padding-left: 50px;
          padding-right: 50px;
          cursor: pointer;
          font-size: 15px;
          width: 212px;
        }

        

        .par{
          margin-bottom: 13px;
          color: #5a5b5c;
          font-size: 11px;
        }

        .Meao{
          width: 50px;
          height: 50px;
          border-radius: 100px;
          vertical-align: middle;
          object-fit: cover;

        }

        .OOO{
          color: white;
          background-color: rgb(29, 155, 240);
          height: 30px;
          width: 80px;
          font-weight: bold;
          font: bolder;
          border-radius: 15px;
          cursor: pointer;
          border: none;
          vertical-align: middle;
          transition: opacity 0.15s,box-shadow 0.2s;
        }

        .OOO:active{
          opacity: 0.7;
        }

        .OOO:hover{
          
          box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
        }

        
        .hapen{
          margin-right: 70px;
          color: #9b9c9d;          
          vertical-align: middle;
          margin-left: 12px;
        }

        
      </style>
  </head>
  <body>

  </body>
</html>
